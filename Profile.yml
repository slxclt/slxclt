name: Update Profile Cards

on:
  schedule:
    - cron: "0 */6 * * *"      # tiap 6 jam
  workflow_dispatch:           # tombol "Run workflow" manual
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1) Snake (monokrom)
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ffffff&color_dots=#171717,#3f3f46,#71717a,#a1a1aa,#f4f4f5

      # 2) Kartu stats, languages, streak, activity, trophies
      - name: Generate cards
        env:
          # Opsional: buat secret PROFILE_TOKEN (PAT dengan scope read:user) agar kontribusi private ikut terhitung
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      # 3) Commit hasilnya
      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: update profile cards"
          git push
